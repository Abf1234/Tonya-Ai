name: truth-guardian

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-truth_guardian}
      POSTGRES_USER: ${POSTGRES_USER:-truth_guardian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-truth_guardian_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-truth_guardian} -d ${POSTGRES_DB:-truth_guardian}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      DEBUG: "True"
      DATABASE_URL: postgresql://${POSTGRES_USER:-truth_guardian}:${POSTGRES_PASSWORD:-truth_guardian_dev}@db:5432/${POSTGRES_DB:-truth_guardian}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      REDIS_URL: redis://redis:6379/0
      ALLOWED_HOSTS: localhost,127.0.0.1,api
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      CSRF_TRUSTED_ORIGINS: http://localhost:5173
      APPWRITE_ENDPOINT: ${APPWRITE_ENDPOINT:-}
      APPWRITE_ALLOW_INSECURE_ENDPOINT: ${APPWRITE_ALLOW_INSECURE_ENDPOINT:-False}
      APPWRITE_PROJECT_ID: ${APPWRITE_PROJECT_ID:-}
      APPWRITE_DATABASE_ID: ${APPWRITE_DATABASE_ID:-}
      APPWRITE_STORAGE_BUCKET_ID: ${APPWRITE_STORAGE_BUCKET_ID:-}
      SECURE_COOKIES: "False"
      SECURE_SSL_REDIRECT: "False"
    command: >-
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      DEBUG: "True"
      DATABASE_URL: postgresql://${POSTGRES_USER:-truth_guardian}:${POSTGRES_PASSWORD:-truth_guardian_dev}@db:5432/${POSTGRES_DB:-truth_guardian}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      REDIS_URL: redis://redis:6379/0
      APPWRITE_ENDPOINT: ${APPWRITE_ENDPOINT:-}
      APPWRITE_ALLOW_INSECURE_ENDPOINT: ${APPWRITE_ALLOW_INSECURE_ENDPOINT:-False}
      APPWRITE_PROJECT_ID: ${APPWRITE_PROJECT_ID:-}
      APPWRITE_DATABASE_ID: ${APPWRITE_DATABASE_ID:-}
      APPWRITE_STORAGE_BUCKET_ID: ${APPWRITE_STORAGE_BUCKET_ID:-}
    command: celery -A config worker --loglevel=info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_URL: /api
      VITE_API_PROXY_TARGET: http://api:8000
      VITE_APPWRITE_ENDPOINT: ${VITE_APPWRITE_ENDPOINT:-}
      VITE_APPWRITE_PROJECT_ID: ${VITE_APPWRITE_PROJECT_ID:-}
      VITE_APPWRITE_DATABASE_ID: ${VITE_APPWRITE_DATABASE_ID:-}
      VITE_APPWRITE_STORAGE_BUCKET_ID: ${VITE_APPWRITE_STORAGE_BUCKET_ID:-}
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
